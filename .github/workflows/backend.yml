name: CI

on: [push]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Analysing the code with ruff
      run: uv run ruff check .
  syntax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Syntax check
      run: uv run python -m compileall . -q
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Type checking
      run: uv run mypy
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen   
    - name: Security audit
      # chromadb server-mode RBAC/RCE advisories — we only use the embedded client, no network exposure; revisit if ingestion service ever runs Chroma standalone
      run: uv run pip-audit --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
  unit-test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
      WRITE_ROLE_USER: test
      WRITE_ROLE_PASSWORD: test
      READ_ROLE_USER: test
      READ_ROLE_PASSWORD: test
      HUMAN_REVIEWER_ROLE_USER: test
      HUMAN_REVIEWER_ROLE_PASSWORD: test
      VERIFY_TOKEN: test
      APP_SECRET: test
      WHATSAPP_ACCESS_TOKEN: test
      OPENAI_API_KEY: test-key
      ELEVENLABS_API_KEY: test-key
      DB_USER: test
      DB_PASSWORD: test
      REDIS_URL: redis://localhost:6379
      DB_HOST: localhost
      DB_NAME: test
      DOMAIN: localhost
      BROKER_URL: redis://localhost:6379
      INGESTION_API_KEY: test-key
      TWILIO_AUTH_TOKEN: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Run unit tests
      run: uv run pytest tests/unit
  integration-test:
    needs: unit-test
    env:
      GOOGLE_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
      WRITE_ROLE_USER: test
      WRITE_ROLE_PASSWORD: test
      READ_ROLE_USER: test
      READ_ROLE_PASSWORD: test
      HUMAN_REVIEWER_ROLE_USER: test
      HUMAN_REVIEWER_ROLE_PASSWORD: test
      VERIFY_TOKEN: test
      APP_SECRET: test
      WHATSAPP_ACCESS_TOKEN: test
      OPENAI_API_KEY: test-key
      ELEVENLABS_API_KEY: test-key
      DB_USER: test
      DB_PASSWORD: test
      REDIS_URL: redis://localhost:6379
      DB_HOST: localhost
      DB_NAME: test
      DOMAIN: localhost
      BROKER_URL: redis://localhost:6379
      INGESTION_API_KEY: test-key
      TWILIO_AUTH_TOKEN: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Run integration tests
      run: uv run pytest tests/integration
  eval:
    needs: [unit-test,integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.13
          version: 0.11.19
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml 
            **/uv.lock 
            **/*.py.lock
      - name: Install dependencies
        run: |
          uv sync --all-groups --frozen
      - name: Run retrieval eval
        run: uv run python -m src.scripts.eval_retrieval
  build:
    needs: [lint, syntax, typecheck, security-audit, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: docker metadata
        id: metadata
        uses:  docker/metadata-action@v6
        with: 
          images: ghcr.io/silverd087/customer-support-agent-backend
          tags: |
            type=sha,format=short
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

    
