name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Analysing the code with ruff
      run: uv run ruff check .
  syntax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Syntax check
      run: uv run python -m compileall . -q
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen
    - name: Type checking
      run: uv run mypy
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.13
        version: 0.11.19
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml 
          **/uv.lock 
          **/*.py.lock
    - name: Install dependencies
      run: |
        uv sync --all-groups --frozen   
    - name: Security audit
      # chromadb server-mode RBAC/RCE advisories — we only use the embedded client, no network exposure; revisit if ingestion service ever runs Chroma standalone
      run: pip-audit --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
    
